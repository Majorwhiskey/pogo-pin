[package]
name = "pogo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Agent-friendly hardware workbench for ESP32 boards: flash, reset, capture serial, and drive a probe, with JSON output and an MCP server"
readme = "../../README.md"
keywords = ["esp32", "embedded", "hardware", "mcp", "cli"]
categories = ["command-line-utilities", "embedded", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
ctrlc = { version = "3.5.2", features = ["termination"] }
humantime = "2.4.0"
pogo-core = { version = "0.1.0-rc.2", path = "../pogo-core" }
pogo-mcp = { version = "0.1.0-rc.2", path = "../pogo-mcp" }
serde = "1.0.229"
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints]
workspace = true

[[bin]]
name = "pogo"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json", "redactions"] }
jsonschema = { version = "0.60.1", default-features = false }
predicates = "3.1.4"
serde_json = "1.0.154"
