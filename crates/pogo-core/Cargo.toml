[package]
name = "pogo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Core library for pogo: ESP32 flashing, serial capture with panic detection, and the pogo probe"
readme = "../../README.md"
keywords = ["esp32", "embedded", "serial", "hardware"]
categories = ["embedded", "development-tools", "hardware-support"]

[dependencies]
addr2line = "0.27.1"
directories = "6.0.0"
espflash = { version = "4.7.0", default-features = false, features = ["serialport"] }
humantime = "2.4.0"
object = "0.40.0"
pogo-protocol = { version = "0.1.0-rc.1", path = "../pogo-protocol" }
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
thiserror = "2.0.21"
toml = "1.1.8"

[lints]
workspace = true

[dev-dependencies]
heapless = "0.9.3"
