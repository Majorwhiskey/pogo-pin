[package]
name = "pogo-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "MCP server exposing pogo hardware workbench tools to AI agents"
readme = "../../README.md"
keywords = ["mcp", "esp32", "embedded", "agent"]
categories = ["embedded", "development-tools"]

[dependencies]
humantime = "2.4.0"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
pogo-core = { version = "0.1.0", path = "../pogo-core" }
rmcp = { version = "3.8.0", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "net"] }

[lints]
workspace = true
