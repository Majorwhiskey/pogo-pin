[graph]
all-features = false

[advisories]
version = 2
ignore = [
    # humantime is unmaintained but has no known vulnerability, and no maintained
    # drop-in exists; it only parses durations like "10s" from flags and config.
    { id = "RUSTSEC-2026-0542", reason = "unmaintained, no known vulnerability" },
    # chrono arrives through rmcp and schemars, not our code; unmaintained, no upgrade.
    { id = "RUSTSEC-2026-0543", reason = "transitive, unmaintained, no known vulnerability" },
]

[licenses]
version = 2
# MPL-2.0 is required by `serialport` (docs/architecture.md §5).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
