[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["firmware/*"]

[workspace.package]
version = "0.1.0-rc.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Majorwhiskey/pogo-pin"
homepage = "https://github.com/Majorwhiskey/pogo-pin"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
